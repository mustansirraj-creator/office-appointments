<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Appointments</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f7;
            color: #20343b;
        }

        header {
            background: white;
            padding: 25px 8%;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            letter-spacing: 2px;
        }

        main {
            max-width: 850px;
            margin: 70px auto;
            padding: 30px;
        }

        .hero {
            background: #e5f0ed;
            padding: 55px 40px;
            border-radius: 15px;
        }

        h1 {
            font-size: 46px;
            line-height: 1.2;
        }

        h1 span {
            color: #1d6470;
        }

        p {
            line-height: 1.7;
            color: #657786;
        }

        .button {
            display: inline-block;
            background: #1d6470;
            color: white;
            padding: 14px 24px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: white;
            color: #657786;
        }
    </style>
</head>

<body>

<header>
    OFFICE APPOINTMENTS
</header>

<main>
    <section class="hero">
        <h1>
            Schedule a meeting
            <br>
            <span>at a time that works.</span>
        </h1>

        <p>
            Welcome to our office appointment portal.
            You can request an appointment at a convenient
            date and time. All requests are subject to
            office approval.
        </p>

        <a href="#" class="button">
            Request an Appointment
        </a>
    </section>
</main>

<footer>
    © 2026 Office Appointments
</footer>

</body>
</html>
